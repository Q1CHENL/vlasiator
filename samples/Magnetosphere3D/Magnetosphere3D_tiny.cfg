# Very small Vlasiator magnetosphere config
# Reduced spatial domain for quick tests

project = Magnetosphere
dynamic_timestep = 1
ParticlePopulations = proton

[bailout]
max_memory = 58

[AMR]
max_spatial_level = 1
refine_radius = 1.0e8

[io]
diagnostic_write_interval = 20
write_initial_state = 0
system_write_t_interval = 20
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[gridbuilder]
x_length = 6
y_length = 6
z_length = 6

x_min = -2.0e8
x_max =  2.0e8
y_min = -2.0e8
y_max =  2.0e8
z_min = -2.0e8
z_max =  2.0e8

t_max = 0.1

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -4.0e6
vx_max = +4.0e6
vy_min = -4.0e6
vy_max = +4.0e6
vz_min = -4.0e6
vz_max = +4.0e6
vx_length = 40
vy_length = 40
vz_length = 40

[proton_sparse]
minValue = 1.0e-15

[Magnetosphere]
constBgBX = 0.0
constBgBY = 0.0
constBgBZ = -5.0e-9

dipoleType = 4
dipoleTiltPhi = 0.0
dipoleTiltTheta = 0
dipoleXFull = 9.5565e7
dipoleXZero = 2.5e8
dipoleInflowBX = 0.0
dipoleInflowBY = 0.0
dipoleInflowBZ = 0.0

refine_L2radius = 8.0e7
refine_L2tailthick = 2.0e7
refine_L1radius = 1.2e8
refine_L1tailthick = 4.0e7
refine_L3radius = 5.0e7
refine_L3nosexmin = 4.0e7
refine_L3tailheight = 1.0e7
refine_L3tailwidth = 6.0e7
refine_L3tailxmin = -15.0e7
refine_L3tailxmax = -4.0e7

[proton_Magnetosphere]
T = 0.5e6
rho = 1.0e6
VX0 = -7.5e5
VY0 = 0.0
VZ0 = 0.0
taperInnerRadius = 5e7
taperOuterRadius = 1e8

[boundaries]
periodic_x = no
periodic_y = no
periodic_z = no
boundary = Outflow
boundary = Maxwellian
boundary = Copysphere

[outflow]
precedence = 3

[proton_outflow]
face = x-
face = y-
face = y+
face = z-
face = z+

[maxwellian]
face = x+
precedence = 4
reapplyUponRestart = 1

[proton_maxwellian]
dynamic = 0
file_x+ = /home/ge43fij2/vlasiator2/samples/Magnetosphere3D/sw1.dat

[copysphere]
centerX = 0.0
centerY = 0.0
centerZ = 0.0
radius = 38.1e6
precedence = 2
reapplyUponRestart = 1

[proton_copysphere]
T = 1.5e6
rho = 3.0e6
VX0 = 0.0
VY0 = 0.0
VZ0 = 0.0

[loadBalance]
algorithm = RCB
rebalanceInterval = 100
tolerance = 1.5

[variables]
output = fg_b
output = fg_e
output = populations_vg_rho
output = populations_vg_v
output = populations_vg_blocks
output = vg_b_vol
output = vg_e_vol
output = vg_boundarytype
output = vg_rank
diagnostic = populations_vg_blocks

[proton_energydensity]
solarwindspeed = 7.5e5

[proton_precipitation]
nChannels = 9
emin = 500
emax = 50000

[fieldsolver]
maxSubcycles = 50
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxWaveVelocity = 7494811.45
electronTemperature = 0.5e6
electronDensity = 1.0e6
electronPTindex = 1.666667
ohmGradPeTerm = 1

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2